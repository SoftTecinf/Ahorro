<!DOCTYPE html>
<html lang="es-MX">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahorro Familiar ✨</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
</head>

<body class="min-h-screen pb-16">

    <div id="app-container" class="max-w-4xl mx-auto px-4 pt-4" style="display: none;">

        <!-- Cabecera principal integrada -->
        <header class="mb-6 bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col sm:flex-row items-center justify-between gap-4">
            
            <!-- Izquierda superior: Nuestro Ahorro + Usuario debajo -->
            <div class="flex flex-col items-center sm:items-start">
                <h1 class="text-xl sm:text-2xl font-extrabold text-gray-950 tracking-wide flex items-center gap-2">
                    Nuestro <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-blue-500">Ahorro</span> 🔮
                </h1>
                <div class="flex items-center gap-1.5 mt-1">
                    <span class="text-[10px] uppercase font-bold text-gray-400">SESIÓN ACTIVA:</span>
                    <span id="user-label" class="text-xs font-bold text-purple-600 bg-purple-50 px-2 py-0.5 rounded-md">Cargando...</span>
                </div>
            </div>

            <!-- En medio: Secciones de navegación intactas -->
            <nav class="w-full sm:w-auto">
                <div class="bg-purple-50/50 p-1.5 rounded-2xl flex justify-between gap-1 border border-purple-100">
                    <button type="button" onclick="navegarA('inicio')" data-vista="inicio"
                        class="flex-1 sm:flex-initial px-4 py-2 text-xs sm:text-sm font-semibold rounded-xl transition-all cursor-pointer bg-gradient-to-r from-purple-600 to-blue-500 text-white shadow-sm">
                        🔮 Inicio
                    </button>
                    <button type="button" onclick="navegarA('datos')" data-vista="datos"
                        class="flex-1 sm:flex-initial px-4 py-2 text-xs sm:text-sm font-semibold rounded-xl transition-all cursor-pointer text-gray-500 hover:bg-purple-50/50">
                        📝 Datos
                    </button>
                    <button type="button" onclick="navegarA('config')" data-vista="config"
                        class="flex-1 sm:flex-initial px-4 py-2 text-xs sm:text-sm font-semibold rounded-xl transition-all cursor-pointer text-gray-500 hover:bg-purple-50/50">
                        ⚙️ Configurar
                    </button>
                </div>
            </nav>

            <!-- Derecha superior: Botón salir estilo control financiero -->
            <div>
                <button onclick="cerrarSesion()"
                    class="text-xs text-red-700 hover:text-red-800 bg-red-50 hover:bg-red-100 px-3 py-2 rounded-xl font-medium transition-colors cursor-pointer border border-red-100">
                    Cerrar sesión / Cambiar perfil
                </button>
            </div>
        </header>

        <main id="contenedor-vistas">
            <div id="inicio" class="vista min-h-[400px]"></div>
            <div id="datos" class="vista hidden min-h-[400px]"></div>
            <div id="config" class="vista hidden min-h-[400px]"></div>
        </main>

    </div>

    <!-- Resto de tus modales (sin cambios) -->
    <div id="modal-deposito-familiar" ... (mantén el resto de tu código igual)
