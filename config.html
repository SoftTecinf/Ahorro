<section id="vista-config" class="vista hidden ">
    <div class="p-6">
        <h2 class="text-xl font-bold text-gray-800 mb-2 flex items-center gap-2">
            <span class="text-purple-500">🛠️</span> Configurar y Vincular Asignaciones
        </h2>
        <p class="text-xs text-gray-400 mb-6 font-light">Configura de manera exclusiva qué cuenta bancaria y
            qué integrantes participan en cada proyecto.</p>

        <form onsubmit="guardarConfiguracionProyecto(event)" class="space-y-6">
            <div class="bg-purple-50/30 p-4 rounded-2xl border border-purple-100">
                <label class="block text-xs font-bold text-purple-950 uppercase mb-1.5">1. Selecciona el
                    Proyecto a Configurar</label>
                <select id="config-select-proyecto"
                    class="w-full px-4 py-2.5 border rounded-xl bg-white focus:outline-none" required>
                    <option value="">Selecciona un proyecto...</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1.5">2. Asignar Cuenta
                    Bancaria para Depósitos</label>
                <select id="config-select-cuenta"
                    class="w-full px-4 py-2.5 border rounded-xl bg-white focus:outline-none">
                    <option value="">Ninguna cuenta vinculada (vacío)</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1.5">Participantes
                    activos:</label>
                <div id="config-checkboxes-familiares"
                    class="space-y-2 max-h-48 overflow-y-auto p-3 bg-purple-50/10 rounded-xl border border-purple-50">
                </div>
            </div>

            <button type="submit"
                class="w-full text-white py-3 rounded-xl font-bold tracking-wide btn-gradient cursor-pointer shadow-md mt-4">
                ✨ Aplicar y Guardar Vínculos del Plan
            </button>
        </form>
    </div>
</section>
