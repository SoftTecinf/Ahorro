<section id="inicio" class="grid grid-cols-1 md:grid-cols-3 gap-6">

    <div id="sec-inicio" class="md:col-span-1 space-y-6">
        <div id="inicio-resumen-proyecto" class="hidden fixed inset-0 z-50 bg-white/95 p-6 overflow-y-auto">
            <div class="max-w-lg mx-auto">
                <button onclick="document.getElementById('inicio-resumen-proyecto').classList.add('hidden')"
                    class="mb-4 text-xs font-bold text-gray-400">← Volver a mis planes</button>
            </div>
        </div>

        <div id="contenedor-invitaciones"
            class="bg-white p-6 rounded-3xl neon-card hidden border border-yellow-200 bg-yellow-50/20">
            <h2 class="text-base font-bold text-yellow-800 mb-3 flex items-center gap-2">
                <span>📩</span> Invitaciones Pendientes
            </h2>
            <div id="lista-invitaciones" class="space-y-3"></div>
        </div>
    </div>

    <div class="md:col-span-2">
        <div id="inicio-resumen-proyecto"
            class="bg-white p-6 rounded-3xl neon-card hidden relative border border-purple-100">
            <div id="resumen-contenido"></div>
        </div>
    </div>
</section>
